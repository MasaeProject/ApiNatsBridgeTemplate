# ============================================================
# ApiNatsBridge 示例配置文件 — 搭配 ApiNatsBridgeTemplate 使用
# ApiNatsBridge example config — for use with ApiNatsBridgeTemplate
# ============================================================

# --- HTTP API 服务器配置 (nyaapiserver.HttpAPIServerConfig) ---
# --- HTTP API Server Config (nyaapiserver.HttpAPIServerConfig) ---
httpapiserver_config:
  # HTTP 服务器监听的 IP 地址，设为 0.0.0.0 可接受所有接口的连接 / HTTP server listen IP, set to 0.0.0.0 to accept connections on all interfaces
  httpapiserver_host: "127.0.0.1"
  # HTTP 服务器监听的端口号 / HTTP server listen port
  httpapiserver_port: 9080

  # TLS 证书：两者皆填时启用 HTTPS，留空则使用 HTTP / TLS certificate: fill both to enable HTTPS, leave empty to use HTTP
  # TLS 证书文件路径（PEM 格式） / TLS certificate file path (PEM format)
  httpapiserver_tls_cert_file: ""
  # TLS 私钥文件路径（PEM 格式） / TLS private key file path (PEM format)
  httpapiserver_tls_key_file: ""

  # 超时设置 (秒) / Timeout settings (seconds)
  # 读取完整请求的最大等待时间（秒），防止慢速客户端占用连接 / Maximum wait time to read a complete request (seconds), prevents slow clients from holding connections
  httpapiserver_read_timeout: 5
  # 写入响应的最大等待时间（秒），包含处理时间 / Maximum wait time to write a response (seconds), includes processing time
  httpapiserver_write_timeout: 30
  # Keep-Alive 连接的最大闲置时间（秒），超时后自动断开 / Maximum idle time for Keep-Alive connections (seconds), auto-disconnect after timeout
  httpapiserver_idle_timeout: 60

  # IP 限流 / IP rate limiting
  # 是否启用基于 IP 的请求限流 / Whether to enable IP-based request rate limiting
  httpapiserver_enable_rate_limit: true
  # 时间窗口内单个 IP 允许的最大请求次数 / Maximum number of requests allowed per IP within the time window
  httpapiserver_limit_requests: 50
  # 限流时间窗口大小（秒） / Rate limiting time window size (seconds)
  httpapiserver_limit_window: 1
  # 超出限制后封禁该 IP 的持续时间（秒） / Duration to block the IP after exceeding the limit (seconds)
  httpapiserver_block_duration: 600

# --- NATS 客户端配置 (nyanats.NatsConfig) ---
# --- NATS Client Config (nyanats.NatsConfig) ---
nats_config:
  # NATS 服务器的 IP 地址或主机名 / NATS server IP address or hostname
  nats_server_host: 127.0.0.1
  # NATS 服务器的端口号（默认 4222） / NATS server port (default 4222)
  nats_server_port: 4222

  # 连接认证 (留空则不启用认证) / Connection authentication (leave empty to disable authentication)
  # NATS 连接使用的用户名 / Username for NATS connection
  nats_user: webapi
  # NATS 连接使用的密码 / Password for NATS connection
  nats_password: Ohr1biolei4aeD3eu7isaeyie9di4uuf

  # NATS 客户端名称，用于服务器端识别此连接 / NATS client name, used for server-side identification of this connection
  nats_client_name: ApiNatsBridgeTest

  # 重连策略 / Reconnect policy
  # 与 NATS 服务器断线后的最大重连次数，-1 表示无限重连 / Maximum reconnection attempts after disconnection from NATS server, -1 means unlimited
  nats_max_reconnects: 5
  # 每次重连尝试之间的等待时间（秒） / Wait time between each reconnection attempt (seconds)
  nats_reconnect_wait: 2
  # 初始连接的最大等待时间（秒） / Maximum wait time for initial connection (seconds)
  nats_connect_timeout: 10

  # AES 对称加密：长度必须为 16 / 24 / 32 字节（对应 AES-128 / AES-192 / AES-256）
  # AES symmetric encryption: length must be 16 / 24 / 32 bytes (corresponding to AES-128 / AES-192 / AES-256)
  # 留空则明文传输；可使用 nyanats.GenerateRandomKey() 生成随机密钥 / Leave empty for plaintext transmission; use nyanats.GenerateRandomKey() to generate a random key
  # 全局加密密钥，所有未指定专用密钥的主题皆使用此密钥 / Global encryption key, used for all subjects without a specific key
  nats_encryption_key: "GLOBAL_BACKUP_KEY_32_CHARS_LONG!"

  # 个别主题专用密钥（优先于全局密钥） / Subject-specific keys (takes priority over the global key)
  # 设为 "" 表示该主题明文传输 / Set to "" for plaintext transmission on that subject
  # 主题名称到专用密钥的映射表 / Mapping from subject names to dedicated keys
  nats_theme_keys: {}

# --- 桥接层配置 ---
# --- Bridge Layer Config ---
bridge:
  # 多语言配置（可选值：en、zh、zh_Hant、ja） / Localization settings (options: en, zh, zh_Hant, ja)
  language:
    # 日志输出语言 / Log output language
    log: "zh"
    # HTTP 响应错误消息语言 / HTTP response error message language
    http: "en"
    # 命令行相关消息语言 / CLI message language
    cli: "zh"

  # 日志输出配置 / Log output settings
  log:
    # 是否同时输出到控制台，设为 false 则仅写入文件 / Whether to also output to console, set to false to write to files only
    stdout: true
    # 是否启用调试模式，设为空数组 [] 则仅输出 Info 及以上等级日志 / Whether to enable debug mode, set to empty array [] for Info level and above only
    # 可选值 / Options：
    #   HTTP  = 输出完整 HTTP 请求与响应通信内容，包括标头、Cookie 等 / Output full HTTP request/response content including headers, cookies
    #   NATS  = 输出完整 NATS 通信内容，标明通信方向和主题 / Output full NATS communication content with direction and subject
    #   LIMIT = 输出所有被规则拦截的请求的违规信息与内容 / Output violation info for all requests blocked by rules
    debug: []
    # 是否使用覆盖模式，设为 true 则启动时清空现有日志文件，设为 false 或不提供则仅追加 / Whether to use overwrite mode, set to true to clear existing log files on startup, set to false or omit to append only
    overwrite: true
    # 是否使用彩色控制台输出，设为 true 或不提供则使用彩色，设为 false 则纯文本 / Whether to use colored console output, set to true or omit for colors, set to false for plain text
    color: true
    # STATUS 状态日志的输出间隔秒数，0 或未设定时默认 60 秒 / STATUS log output interval in seconds, defaults to 60 when 0 or unset
    status_interval_seconds: 60
    files:
      # 各模块独立日志文件路径，可分别配置 / Individual log file paths for each module, configurable separately
      # 留空或不填则该模块不写入文件 / Leave empty or omit to disable file output for that module
      # 主流程日志（启动、关闭、配置加载等） / Main process log (startup, shutdown, config loading, etc.)
      main: "logs/main.log"
      # 桥接路由与转发日志（路由匹配、NATS 发送等） / Bridge routing and forwarding log (route matching, NATS publishing, etc.)
      bridge: "logs/bridge.log"
      # HTTP 请求日志（每笔请求的方法、路径、状态码等） / HTTP request log (method, path, status code for each request)
      http: "logs/http.log"
      # NATS 客户端事件日志（连接、断线、重连等） / NATS client event log (connect, disconnect, reconnect, etc.)
      nats: "logs/nats.log"
      # HTTP 服务器与 NATS 状态统计日志（定期汇总的性能指标） / HTTP server and NATS status stats log (periodically aggregated performance metrics)
      status: "logs/status.log"
      # 通用模块日志（如 /ping 等内置模块输出） / Generic module log (output from built-in modules like /ping)
      module: "logs/module.log"

  # 时区，影响所有日志时间戳，支持 IANA 时区名称（如 Asia/Shanghai、America/New_York）或小时偏移（如 8、-5）
  # Timezone, affects all log timestamps, supports IANA timezone names (e.g. Asia/Shanghai, America/New_York) or hour offsets (e.g. 8, -5)
  timezone: "Asia/Shanghai"

  # 日志时间日期显示格式 / Log timestamp display format
  # Go 参考时间格式 / Go reference time format：2006-01-02 15:04:05
  #   - 设为有效格式：控制台与日志文件均使用该格式 / Set to valid format: both console and log files use that format
  #   - 设为空字符串 ""：控制台不显示时间日期，日志文件仍使用默认格式 / Set to "" : console shows no timestamp, log files still use default format
  #   - 未设定（省略此字段）：使用默认值 "2006-01-02 15:04:05" (YYYY-MM-DD HH:mm:ss) / Omitted: uses default "2006-01-02 15:04:05" (YYYY-MM-DD HH:mm:ss)
  #   - 可被路由级别 time_format 覆盖 / Can be overridden by route-level time_format
  # time_format: ""                      # 空字符串：控制台无时间日期 / Empty string: no timestamp on console
  # time_format: "2006-01-02 15:04:05"   # 默认值：YYYY-MM-DD HH:mm:ss / Default: YYYY-MM-DD HH:mm:ss
  # time_format: "15:04:05"              # 仅时间：HH:mm:ss / Time only: HH:mm:ss
  # time_format: "01/02 15:04:05"        # 月/日 时:分:秒 / MM/DD HH:mm:ss
  # time_format: "2006-01-02T15:04:05.000Z07:00" # ISO 8601 格式 / ISO 8601 format

  # CDN 服务商传递真实 IP 的专属标头列表，若 CDN 仅使用 X-Forwarded-For，则无需加入
  # List of CDN provider-specific headers that carry the real IP; if the CDN only uses X-Forwarded-For, no need to add here
  cdnheader:
    - "CF-Connecting-IP" # Cloudflare
    - "True-Client-IP" # Akamai / Cloudflare Enterprise
    - "Fastly-Client-IP" # Fastly
    - "CloudFront-Viewer-Address" # AWS CloudFront
    - "CDN-Viewer-IP" # Google Cloud CDN
    - "X-Azure-ClientIP" # Azure CDN / Microsoft CDN
    - "Incap-Client-IP" # Imperva / Incapsula
    - "X-Sucuri-ClientIP" # Sucuri
    - "X-SP-Forwarding-IP" # StackPath
    - "Ali-Cdn-Real-Ip" # 阿里云 CDN / DCDN / 全站加速
    - "Ar-Real-IP" # ArvanCloud

  # 允许接收错误详细信息的 IP 白名单（用于开发调试） / IP whitelist allowed to receive detailed error information (for development debugging)
  error_detail_ips:
    - "127.0.0.1" # IPv4 本机地址 / IPv4 localhost
    - "::1" # IPv6 本机地址 / IPv6 localhost

  # 微服务返回 JSON 中表示 HTTP 状态码的全局默认键名（可被路由级别覆盖，留空则路由未指定时默认 200）
  # Global default key name for HTTP status code in microservice response JSON (overridable at route level; leave empty to default to 200 when route doesn't specify)
  # http_code_key: ""

  # 微服务返回 JSON 中表示错误码的全局默认键名（可被路由级别覆盖，留空则不启用）
  # Global default key name for error code in microservice response JSON (overridable at route level; leave empty to disable)
  # error_code_key: ""

  # 响应正文的 JSON Schema 验证全局默认规则（可被路由级别覆盖，留空则不限制）
  # Global default JSON Schema validation for response body (overridable at route level; leave empty for no validation)
  # response_schema_body: {}

  # 错误响应正文的 JSON Schema 验证全局默认规则（当 error_code_key 检测到时优先使用，可被路由级别覆盖，留空则不限制）
  # Global default error response body JSON Schema validation (preferred when error_code_key is detected; overridable at route level; leave empty for no validation)
  # response_error_schema_body: {}

  # 微服务错误信息的显示模式全局默认值（可被路由级别覆盖）
  # Global default error info display mode (overridable at route level)
  #   0 = 不在日志文件中记录（仅保留基本的 [HTTP] 日志） / Don't log (only basic [HTTP] log remains)
  #   1 = 在日志文件中记录并输出 / Log and output to file
  #   2 = 在日志文件中记录并输出，内容返回给白名单 IP 用户 / Log, output, and return content to whitelisted IPs
  #   3 = 在日志文件中记录并输出，内容返回给所有用户 / Log, output, and return content to all users
  #   4 = 不记录（仅保留基本的 [HTTP] 日志），内容返回给白名单 IP 用户 / Don't log (only basic [HTTP] log), return content to whitelisted IPs
  #   5 = 不记录（仅保留基本的 [HTTP] 日志），内容返回给所有用户 / Don't log (only basic [HTTP] log), return content to all users
  # error_info_show: 1

  # 请求字段长度限制（全局级别，0 或省略表示不限制，可被路由级别覆盖） / Request field length limits (global level, 0 or omitted means no limit, can be overridden at the route level)
  limits:
    path:
      # 请求路径最大长度（字节） / Request path maximum length (bytes)
      max_length: 2048
    headers:
      # 请求标头最大笔数 / Maximum number of request headers
      max_count: 64
      # 请求标头名称最大长度（字节） / Request header name maximum length (bytes)
      max_key_length: 256
      # 请求标头值最大长度（字节） / Request header value maximum length (bytes)
      max_value_length: 4096
    cookies:
      # Cookie 最大笔数 / Maximum number of cookies
      max_count: 32
      # Cookie 名称最大长度（字节） / Cookie name maximum length (bytes)
      max_key_length: 256
      # Cookie 值最大长度（字节） / Cookie value maximum length (bytes)
      max_value_length: 4096
    params:
      # URL 查询参数最大笔数 / Maximum number of URL query parameters
      max_count: 64
      # 参数名称最大长度（字节） / Parameter name maximum length (bytes)
      max_key_length: 256
      # 参数值最大长度（字节） / Parameter value maximum length (bytes)
      max_value_length: 4096
    body:
      # 请求正文最大长度（字节，此例为 1MB） / Request body maximum length (bytes, 1MB in this example)
      max_length: 1048576
  # 响应字段长度限制（全局级别，可被路由级别覆盖） / Response field length limits (global level, can be overridden at the route level)
  response_limits:
    body:
      # 响应正文最大长度（字节，此例为 1MB） / Response body maximum length (bytes, 1MB in this example)
      max_length: 1048576
    headers:
      # 响应标头最大笔数 / Maximum number of response headers
      max_count: 64
      # 响应标头名称最大长度（字节） / Response header name maximum length (bytes)
      max_key_length: 256
      # 响应标头值最大长度（字节） / Response header value maximum length (bytes)
      max_value_length: 4096

  # --- 令牌验证配置（可选，若省略则不启用令牌验证） ---
  # --- Token verification config (optional; omit to disable token verification) ---
  # token:
  #   # 验证令牌用的 NATS 主题（默认值） / NATS subject for token verification (default)
  #   nats_subject: "auth.token.verify"
  #   # 不需要检查令牌的 HTTP 路径白名单 / HTTP path whitelist for paths not requiring token verification
  #   path_whitelist:
  #     - "/ping"
  #     - "/auth/login"
  #   # 令牌所在 HTTP 标头名称（默认值） / HTTP header name for the token (default)
  #   header_name: "Authorization"
  #   # 令牌的最小长度（默认值） / Minimum token length (default)
  #   min_length: 10
  #   # 令牌的最大长度（默认值） / Maximum token length (default)
  #   max_length: 4096
  #   # tag 部分的分隔符（默认值） / Tag separator (default)
  #   tag_separator: "|"
  #   # 令牌验证成功时的回传值（默认值） / Return value when token verification succeeds (default)
  #   success_value: "0"
  #   # 等待令牌验证回应的超时秒数（默认值） / Timeout in seconds waiting for token verification response (default)
  #   timeout: 5
  #   # 令牌验证结果缓存的最大笔数（默认值，达上限时清空缓存） / Maximum number of cached token verification entries (default, clears cache when limit reached)
  #   cache_max_entries: 1000
  #   # 令牌验证的最大并发请求数（默认值，超限时返回 HTTP 503） / Maximum concurrent token verification requests (default, returns HTTP 503 when exceeded)
  #   max_concurrent: 256
  #
  # # 全局转发 NATS 的最大并发请求数（0 = 不限制） / Maximum concurrent NATS forwarding requests globally (0 = unlimited)
  # max_concurrent: 512
  # # HTTP 层的最大并发请求处理数（0 = 不限制） / Maximum concurrent HTTP request processing (0 = unlimited)
  # http_max_concurrent: 1024
  #
  # # 自定义回应标头（全局级别，附加到所有 HTTP 回应） / Custom response headers (global level, added to all HTTP responses)
  # # 注意 / Note：Access-Control-Allow-Methods 与 Access-Control-Allow-Headers /
  # #   Access-Control-Allow-Methods and Access-Control-Allow-Headers
  # #   当路由 methods 包含 OPTIONS 时会自动从路由设定产生 / are auto-generated from route config when OPTIONS is in methods
  # #   无需在此手动设定；如需覆盖可在路由级别 response_headers 中指定 / no need to set here; override via route-level response_headers if needed
  # response_headers:
  #   Access-Control-Allow-Origin: "*"
  #   X-Frame-Options: "DENY"
  #   X-Content-Type-Options: "nosniff"

# --- 路由转发规则 ---
# --- Route Forwarding Rules ---
# 每条路由定义一个 HTTP 路径如何被验证并转发到 NATS Subject / Each route defines how an HTTP path is validated and forwarded to a NATS subject
routes:
  # HTTP 请求路径（对应 ApiNatsBridgeTemplate 的 ping 服务） / HTTP request path (corresponds to ApiNatsBridgeTemplate's ping service)
  - path: "/ping"
    # 转发至 NATS 的 Subject 名称 / NATS subject name to forward to
    nats_subject: "ping_req"
    # 允许的 HTTP 方法列表 / Allowed HTTP methods list
    methods: ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
    # 要求的 Content-Type（空字符串=不检查；亦可用 application/json） / Required Content-Type (empty string = no check; can also use application/json)
    content_type: "application/x-www-form-urlencoded"
    # NATS 等待微服务响应的超时秒数，超过则返回 504 Gateway Timeout / NATS timeout in seconds waiting for microservice response, returns 504 Gateway Timeout if exceeded
    timeout: 10
    # 转发到 NATS 消息中包含的字段列表（留空则传送所有字段） / List of fields to include in the forwarded NATS message (leave empty to include all fields)
    return_fields:
      - method # HTTP 请求方法（如 GET、POST） / HTTP request method (e.g. GET, POST)
      - path # 请求路径（如 /ping） / Request path (e.g. /ping)
      - headers # 请求标头（键值对 map） / Request headers (key-value map)
      - cookies # 请求 Cookie（键值对 map） / Request cookies (key-value map)
      - remote_addr # 远端地址（含端口，如 127.0.0.1:54321） / Remote address (including port, e.g. 127.0.0.1:54321)
      - ip # 客户端 IP（已解析 CDN 标头后的真实 IP） / Client IP (real IP after resolving CDN headers)
      - params # URL 查询参数（键值对 map） / URL query parameters (key-value map)
      - body # 请求正文（原始字符串内容） / Request body (raw string content)
    # 此路由专用的请求限制（覆盖全局 limits） / Route-specific request limits (overrides global limits)
    limits:
      path:
        # "/ping" 固定 5 字符 / "/ping" is exactly 5 characters
        max_length: 5
      body:
        # 不接收请求体（0 表示禁止携带 body） / Do not accept request body (0 means body is forbidden)
        max_length: 0
      headers:
        # 典型请求标头数量上限 / Typical maximum request header count
        max_count: 16
        # 最长标头名称长度（如 X-Forwarded-For = 15） / Maximum header name length (e.g. X-Forwarded-For = 15)
        max_key_length: 25
        # 标头值最大长度 / Maximum header value length
        max_value_length: 256
      params:
        # 仅接受 1 个查询参数（timestamp） / Only accept 1 query parameter (timestamp)
        max_count: 1
        # "timestamp" = 9 字符 / "timestamp" = 9 characters
        max_key_length: 9
        # int64 正数最大值 9223372036854775807 = 19 位数 / int64 max positive value 9223372036854775807 = 19 digits
        max_value_length: 19
      cookies:
        # Cookie 最大笔数 / Maximum number of cookies
        max_count: 4
        # Cookie 名称最大长度 / Maximum cookie name length
        max_key_length: 8
        # UUID 格式 8-4-4-4-12 = 36 字符 / UUID format 8-4-4-4-12 = 36 characters
        max_value_length: 36
    # 请求正文的 JSON Schema 验证（此处对应 application/x-www-form-urlencoded 的字段结构） / JSON Schema validation for request body (here corresponds to application/x-www-form-urlencoded field structure)
    schema_body:
      # 根类型为对象 / Root type is object
      root_type: object
      # 严格模式：不允许 Schema 中未定义的字段 / Strict mode: fields not defined in the schema are not allowed
      strict: true
      # 允许的属性定义 / Allowed property definitions
      properties:
        # 字段名称 timestamp / Field name: timestamp
        timestamp:
          # 字段类型为字符串 / Field type is string
          type: string
    # 此路由专用的响应限制（覆盖全局 response_limits） / Route-specific response limits (overrides global response_limits)
    response_limits:
      body:
        # 响应正文最大长度：{"pong":±9223372036854775808,"ip":"0000:0000:0000:0000:0000:0000:0000:0000","servertime":9223372036854775807} / Response body maximum length
        max_length: 109
      headers:
        # 仅允许 1 个响应标头（Content-Type） / Only allow 1 response header (Content-Type)
        max_count: 1
        # "Content-Type" = 12 字符 / "Content-Type" = 12 characters
        max_key_length: 12
        # "application/json; charset=utf-8" = 31 字符 / "application/json; charset=utf-8" = 31 characters
        max_value_length: 31
    # 响应正文的 JSON Schema 验证（验证微服务返回的 JSON 结构） / JSON Schema validation for response body (validates the JSON structure returned by the microservice)
    response_schema_body:
      # 根类型为对象 / Root type is object
      root_type: object
      # 严格模式：不允许 Schema 中未定义的字段 / Strict mode: fields not defined in the schema are not allowed
      strict: true
      # 必需字段列表 / Required fields list
      required:
        # 必须包含 pong 字段 / Must include the pong field
        - pong
        # 必须包含 ip 字段 / Must include the ip field
        - ip
        # 必须包含 servertime 字段 / Must include the servertime field
        - servertime
      # 属性定义 / Property definitions
      properties:
        # pong 字段定义 / pong field definition
        pong:
          # 类型为整数（时间戳响应） / Type is integer (timestamp response)
          type: integer
        # ip 字段定义 / ip field definition
        ip:
          # 类型为字符串（客户端 IP 回显） / Type is string (client IP echo)
          type: string
        # servertime 字段定义 / servertime field definition
        servertime:
          # 类型为整数（服务器系统毫秒时间戳） / Type is integer (server system millisecond timestamp)
          type: integer

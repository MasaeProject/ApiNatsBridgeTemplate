# ==========================================================
# NATS 伺服器示例配置 — 搭配 ApiNatsBridgeTemplate 使用
# ==========================================================

# 伺服器名稱，在叢集中必須唯一
server_name: "NyaNATS_Dev_Server"

# 監聽地址和埠
host: "127.0.0.1"
port: 4222

# HTTP 監控埠（可透過瀏覽器訪問 http://localhost:8222 檢視伺服器狀態）
http_port: 8222

# ==========================================================
# 日誌配置 (Logging)
# ==========================================================

# 開啟除錯日誌（生產環境建議關閉）
debug: true
# 開啟跟蹤日誌（僅限開發環境，極度耗效能）
trace: false
# 日誌記錄時間戳
logtime: true

# 將日誌輸出到檔案（不指定則輸出到控制檯）
log_file: "../logs/nats-server.log"

# ==========================================================
# 安全與認證 (Authentication)
# ==========================================================

authorization {
  users: [
    {
      # ApiNatsBridge 與 ApiNatsBridgeTemplate 共用帳號
      user: "webapi",
      password: "Ohr1biolei4aeD3eu7isaeyie9di4uuf",
      permissions: {
        publish: ["ping_req", "_INBOX.>"],
        subscribe: ["_INBOX.>", "ping_req"]
      }
    }
  ]
}

# ==========================================================
# 效能限制 (Limits)
# ==========================================================

# 最大載荷（單個訊息大小）
max_payload: 2MB

# 最大連線數
max_connections: 1000

# 客戶端寫緩衝區大小
max_pending: 10MB

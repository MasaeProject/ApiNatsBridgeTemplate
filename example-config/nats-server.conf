# ==========================================================
# NATS 服务器示例配置 — 搭配 ApiNatsBridgeTemplate 使用
# NATS server example config — for use with ApiNatsBridgeTemplate
# ==========================================================

# 服务器名称，在集群中必须唯一 / Server name, must be unique in a cluster
server_name: "NyaNATS_Dev_Server"

# 监听地址和端口 / Listen address and port
host: "127.0.0.1"
port: 4222

# HTTP 监控端口（可通过浏览器访问 http://localhost:8222 查看服务器状态） / HTTP monitoring port (visit http://localhost:8222 to view server status)
http_port: 8222

# ==========================================================
# 日志配置 (Logging) / Logging
# ==========================================================

# 开启调试日志（生产环境建议关闭） / Enable debug logging (recommended to disable in production)
debug: true
# 开启跟踪日志（仅限开发环境，极度耗性能） / Enable trace logging (development only, extremely performance-intensive)
trace: false
# 日志记录时间戳 / Log timestamps
logtime: true

# 将日志输出到文件（不指定则输出到控制台） / Output logs to file (outputs to console if not specified)
log_file: "../logs/nats-server.log"

# ==========================================================
# 安全与认证 (Authentication) / Authentication
# ==========================================================

authorization {
  users: [
    {
      # ApiNatsBridge 与 ApiNatsBridgeTemplate 共用账号 / Shared account for ApiNatsBridge and ApiNatsBridgeTemplate
      user: "webapi",
      password: "Ohr1biolei4aeD3eu7isaeyie9di4uuf",
      permissions: {
        publish: ["ping_req", "_INBOX.>"],
        subscribe: ["_INBOX.>", "ping_req"]
      }
    }
  ]
}

# ==========================================================
# 性能限制 (Limits) / Limits
# ==========================================================

# 最大载荷（单个消息大小） / Maximum payload (single message size)
max_payload: 2MB

# 最大连接数 / Maximum connections
max_connections: 1000

# 客户端写缓冲区大小 / Client write buffer size
max_pending: 10MB
